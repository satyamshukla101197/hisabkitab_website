
name: Deploy HisabKitab Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hisabkitab-website-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate website entry point
        run: |
          test -f index.html || {
            echo "ERROR: index.html was not found in the repository root."
            exit 1
          }

      - name: Deploy website to Lightsail
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete
          path: ./
          remote_path: /var/www/hisabkitab/
          remote_host: ${{ secrets.LIGHTSAIL_HOST }}
          remote_user: ${{ secrets.LIGHTSAIL_USER }}
          remote_key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          remote_port: 22
